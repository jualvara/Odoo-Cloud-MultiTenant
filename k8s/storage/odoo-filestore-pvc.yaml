apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-cliente-a-filestore-pvc
  namespace: odoo-multitenant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
