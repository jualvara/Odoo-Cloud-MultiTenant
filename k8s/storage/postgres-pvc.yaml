apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-cliente-a-pvc
  namespace: odoo-multitenant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
