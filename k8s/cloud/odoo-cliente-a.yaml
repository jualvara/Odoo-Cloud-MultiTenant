apiVersion: v1
kind: ServiceAccount
metadata:
  name: odoo-cliente-a
  namespace: odoo-multitenant
  annotations:
    iam.gke.io/gcp-service-account: odoo-cliente-a@pec3-odoo-cloud-jca26.iam.gserviceaccount.com
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: odoo-cliente-a-config
  namespace: odoo-multitenant
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/pec3-odoo-cloud-jca26/secrets/odoo-cliente-a-db-password/versions/latest"
        path: "db-password"
      - resourceName: "projects/pec3-odoo-cloud-jca26/secrets/odoo-cliente-a-master-password/versions/latest"
        path: "master-password"
---
apiVersion: v1
kind: Service
metadata:
  name: odoo-cliente-a
  namespace: odoo-multitenant
  annotations:
    cloud.google.com/backend-config: '{"default": "odoo-cliente-a-backendconfig"}'
spec:
  selector:
    app: odoo-cliente-a
  ports:
    - name: http
      port: 8069
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-cliente-a
  namespace: odoo-multitenant
spec:
  # Filestore RWX permite que ambas réplicas compartan los adjuntos y sesiones.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: odoo-cliente-a
  template:
    metadata:
      labels:
        app: odoo-cliente-a
    spec:
      serviceAccountName: odoo-cliente-a
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: odoo-cliente-a
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: odoo-cliente-a
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: preparar-filestore
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/lib/odoo/sessions
              chown -R 100:101 /var/lib/odoo
              chmod 0770 /var/lib/odoo
              chmod 0770 /var/lib/odoo/sessions
          volumeMounts:
            - name: filestore
              mountPath: /var/lib/odoo
        - name: crear-configuracion
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - |
              cat > /config/odoo.conf <<EOF
              [options]
              admin_passwd = $(cat /var/run/secrets/odoo/master-password)
              db_host = 10.184.0.3
              db_port = 5432
              db_user = odoo_cliente_a
              db_password = $(cat /var/run/secrets/odoo/db-password)
              db_name = cliente_a_cloud
              dbfilter = ^cliente_a_cloud$
              list_db = False
              proxy_mode = True
              data_dir = /var/lib/odoo
              EOF
          volumeMounts:
            - name: odoo-config
              mountPath: /config
            - name: odoo-secrets
              mountPath: /var/run/secrets/odoo
              readOnly: true
        - name: inicializar-base
          image: odoo:19.0
          command: ["odoo"]
          args:
            - -c
            - /config/odoo.conf
            - -d
            - cliente_a_cloud
            - --stop-after-init
          volumeMounts:
            - name: filestore
              mountPath: /var/lib/odoo
            - name: odoo-config
              mountPath: /config
      containers:
        - name: odoo
          image: odoo:19.0
          ports:
            - name: http
              containerPort: 8069
          readinessProbe:
            httpGet:
              path: /web/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /web/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: filestore
              mountPath: /var/lib/odoo
            - name: odoo-config
              mountPath: /etc/odoo/odoo.conf
              subPath: odoo.conf
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: odoo-cliente-a-filestore-rwx
        - name: odoo-config
          emptyDir: {}
        - name: odoo-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: odoo-cliente-a-config
