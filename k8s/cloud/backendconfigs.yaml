apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: odoo-cliente-a-backendconfig
  namespace: odoo-multitenant
spec:
  healthCheck:
    type: HTTP
    requestPath: /web/health
    port: 8069
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
