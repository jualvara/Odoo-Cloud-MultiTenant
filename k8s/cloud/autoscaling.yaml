apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: odoo-cliente-a
  namespace: odoo-multitenant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: odoo-cliente-a
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: odoo-cliente-a
  namespace: odoo-multitenant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: odoo-cliente-a
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
